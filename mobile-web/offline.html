<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IndividuAula · sem conexão</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #071736; color: #fff; }
      main { width: min(100%, 420px); border: 1px solid rgba(255,255,255,.3); padding: 32px; }
      .mark { width: 64px; height: 64px; display: grid; place-items: center; margin-bottom: 32px; background: #f4c43e; color: #071736; font-size: 26px; font-weight: 800; }
      .eyebrow { margin: 0 0 10px; color: #f4c43e; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 32px; line-height: 1; letter-spacing: -.05em; }
      p { margin: 18px 0 0; color: #c4cad8; font-size: 15px; line-height: 1.6; }
      button { margin-top: 28px; border: 0; padding: 13px 18px; background: #f4c43e; color: #071736; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">Au</div>
      <p class="eyebrow">IndividuAula</p>
      <h1>Você está sem conexão.</h1>
      <p>Confira a internet e tente novamente para voltar ao seu espaço de estudos.</p>
      <button type="button" onclick="location.href='https://individuaula.tech/'">Tentar novamente</button>
    </main>
  </body>
</html>
